services:
  coder-init:
    # Init container to fix volume permissions
    image: alpine:latest
    user: "0:0"
    volumes:
      - coder_data:/home/coder/.config
    command: sh -c "mkdir -p /home/coder/.config && chown -R 1000:1000 /home/coder/.config && chmod -R 755 /home/coder/.config"
    restart: "no"

  docker-socket-proxy:
    # The only container that sees the host Docker socket. Coder reaches Docker
    # through this allowlisting proxy instead of mounting the socket itself.
    # Allowed API surface: see guide.md "Docker access via socket proxy".
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy
    environment:
      # Endpoint sections Coder's Docker template needs (everything else stays 0)
      - CONTAINERS=1
      - IMAGES=1
      - VOLUMES=1
      - NETWORKS=1
      # Allow non-GET methods (create/start/stop/delete) on the sections above
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - docker_proxy

  coder:
    # This is the Coder Control Plane
    image: ghcr.io/coder/coder:latest
    container_name: coder
    depends_on:
      - coder-init
      - docker-socket-proxy
    environment:
      # The URL where users access the dashboard
      - CODER_ACCESS_URL=http://localhost:7080
      # Address to listen on inside the container
      - CODER_HTTP_ADDRESS=0.0.0.0:7080
      # Allow iframe embedding from your domain
      - CODER_BROWSER_ONLY=true
      # Docker API via the socket proxy (no host socket mount, no root group)
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    ports:
      - "7080:7080"
    volumes:
      # Persist Coder's internal database
      - coder_data:/home/coder/.config
    restart: unless-stopped
    networks:
      - coder_network
      - docker_proxy

  gitea:
    # Gitea Git server for internal repositories
    image: gitea/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://localhost:3000
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=true
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      - coder_network

volumes:
  coder_data:
  gitea_data:

networks:
  coder_network:
    # Fixed name so docker-template.tf can attach workspaces to it
    name: coder_network
    driver: bridge
  docker_proxy:
    # Internal-only: just coder <-> docker-socket-proxy. Workspaces are never
    # attached here, so code inside a workspace cannot reach the Docker API.
    internal: true
