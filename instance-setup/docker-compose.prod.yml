# AutoWRX Production Deployment
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  # AutoWRX - Backend serves both API and frontend static files
  autowrx:
    # platform: linux/amd64  # Commented out for local testing on non-AMD64 machines
    container_name: ${NAME:-prod}-autowrx
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: ghcr.io/eclipse-autowrx/autowrx/autowrx:latest
    ports:
      - "${FRONTEND_PORT:-3200}:3200"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3200}
      # Always use port 27017 for internal Docker network communication
      # MONGODB_PORT (27010) is only for external host access
      MONGODB_URL: mongodb://autowrx-db:27017/${MONGODB_DATABASE:-autowrx}
      JWT_SECRET: ${JWT_SECRET}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-token}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GENAI_URL: ${GENAI_URL:-}
      KIT_SERVER_URL: ${KIT_SERVER_URL:-}
      RUNTIME_SERVICE_MAPPINGS: ${RUNTIME_SERVICE_MAPPINGS:-}
    volumes:
      - '${UPLOAD_PATH_HOST:-./data/upload}:/usr/src/playground-be/static/uploads'
      - '${PLUGIN_PATH_HOST:-./data/plugin}:/usr/src/playground-be/static/plugin'
      # - '${GLOBAL_CSS_PATH_HOST:-./data/global.css}:/usr/src/playground-be/static/global.css'
      # Uncomment above line to use customized global.css file
    depends_on:
      autowrx-db:
        condition: service_healthy
    networks:
      - autowrx-network
    restart: always

  # MongoDB - Database
  autowrx-db:
    # platform: linux/amd64  # Commented out for local testing on non-AMD64 machines
    container_name: ${NAME:-prod}-autowrx-db
    # 4.4 is end-of-life (Feb 2024, no security patches). 7.0 is a drop-in for
    # this stack (Mongoose 8 / Node driver 6). Upgrading an EXISTING 4.4 volume
    # in place is not supported — dump from 4.4, wipe the volume, restore into 7.0
    # (restoring rebuilds all indexes and needs no stepwise FCV upgrades).
    image: mongo:7.0
    # ports:
    #   - "${MONGODB_PORT:-27010}:27017"
    volumes:
      - autowrx-dbdata:/data/db
      # MongoDB 7 images do not bundle database tools (mongodump/mongorestore).
      # If your backup tooling execs mongodump inside the container, download the
      # tools once and mount them, e.g.:
      #   curl -fsSL -o /tmp/tools.tgz https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.5.tgz
      #   mkdir -p tools && tar -xzf /tmp/tools.tgz -C tools
      #   (then uncomment the next line)
      # - ./tools/mongodb-database-tools-ubuntu2204-x86_64-100.9.5/bin:/opt/dbtools:ro
    networks:
      - autowrx-network
    restart: always
    healthcheck:
      # mongosh only — the legacy `mongo` shell was removed from images in 6.0+
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  autowrx-dbdata:
    name: ${NAME:-prod}-autowrx-dbdata

networks:
  autowrx-network:
    name: ${NAME:-prod}-autowrx-network
    driver: bridge
