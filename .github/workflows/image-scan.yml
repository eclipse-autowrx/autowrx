name: image-scan

# Advisory Trivy scan of the backend image (HIGH/CRITICAL, fixable only).
# Runs only when image inputs change, plus weekly to catch new CVEs.
# continue-on-error: findings are reported, not blocking.

on:
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "backend/package.json"
      - "backend/yarn.lock"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - ".github/workflows/image-scan.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          push: false
          tags: autowrx-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: autowrx-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: "1"
      - name: Publish report
        if: always()
        run: |
          {
            echo "### Trivy: autowrx-backend:scan (HIGH,CRITICAL, fixed only)"
            echo '```'
            cat trivy.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
