name: security

# Advisory security scans: CodeQL, yarn audit, TruffleHog. Every job is
# continue-on-error so findings are reported without blocking merges until
# the existing backlog is triaged; then drop continue-on-error to enforce.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: yarn audit (${{ matrix.package }}, high+, runtime deps)
        working-directory: ${{ matrix.package }}
        run: |
          set +e
          yarn audit --level high --groups dependencies | tee audit.txt
          status=${PIPESTATUS[0]}
          {
            echo "### yarn audit: ${{ matrix.package }}"
            echo '```'
            tail -n 60 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  secret-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PRs scan the PR range, pushes scan the pushed range, schedule scans
      # recent history. Only verified (live) secrets are reported.
      - uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'push' && github.sha) || 'HEAD' }}
          extra_args: --only-verified
