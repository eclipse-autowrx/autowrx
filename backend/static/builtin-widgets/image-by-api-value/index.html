<html>

<head>
    <link rel="stylesheet" href="../tailwind.min.css">
    <script defer src="/builtin-widgets/syncer.js"></script>
    <style>
        #image-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            /* Ensure background is white */
        }

        #api-image {
            max-width: 100%;
            max-height: 100%;
            background-color: white;
            /* Ensure background is white */
        }
    </style>

    <div id="image-container" class="flex flex-col p-4 items-center space-y-6">
        <img id="api-image" src="" alt="API Image" onerror="this.style.display='none'" /> <!-- Hide image on error -->
    </div>

    <script src="widget.js"></script>
</body>

</html>
