<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/builtin-widgets/tailwind.min.css" />
  <script defer src="/builtin-widgets/syncer.js"></script>
  <style>
    #preview-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
      padding: 16px;
    }

    #placeholder svg {
      width: 40px;
      height: 40px;
      opacity: 0.4;
    }

    /* Error / connecting states */
    #error-state,
    #connecting-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      text-align: center;
      padding: 32px;
      background: #fafafa;
    }

    #error-state .error-icon,
    #connecting-state .error-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    #error-state .error-icon svg {
      width: 26px;
      height: 26px;
      color: #9ca3af;
    }

    #connecting-state .spinner {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #e5e7eb;
      border-top-color: #9ca3af;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #error-state .error-title,
    #connecting-state .error-title {
      font-size: 15px;
      font-weight: 600;
      color: #374151;
      margin: 0;
    }

    #error-state .error-subtitle,
    #connecting-state .error-subtitle {
      font-size: 13px;
      color: #9ca3af;
      margin: 0;
      max-width: 260px;
      line-height: 1.5;
    }

    #error-state .error-badge,
    #connecting-state .error-badge {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 9999px;
      padding: 3px 10px;
      font-size: 11px;
      color: #6b7280;
      font-family: ui-monospace, monospace;
    }

    #error-state .error-badge .dot,
    #connecting-state .error-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d1d5db;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="h-screen overflow-hidden bg-gray-50">
  <div id="container" class="w-full h-full">

    <!-- No runtime selected -->
    <div id="placeholder">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M9 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-4M9 3l6 0m-6 0v6m6-6v6m0 0H9m6 0v8" />
      </svg>
      <span id="placeholder-text">No runtime selected</span>
    </div>

    <!-- Waiting for the app's HTTP server to come up -->
    <div id="connecting-state">
      <div class="error-icon">
        <div class="spinner"></div>
      </div>
      <p class="error-title">Starting application</p>
      <p class="error-subtitle">Waiting for the application to serve the preview.</p>
      <span class="error-badge" id="connecting-runtime-badge" style="display:none">
        <span class="dot"></span>
        <span id="connecting-runtime-label"></span>
      </span>
    </div>

    <!-- Connection / runtime error -->
    <div id="error-state">
      <div class="error-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M5.636 5.636a9 9 0 1 0 12.728 12.728A9 9 0 0 0 5.636 5.636zM12 8v4m0 4h.01" />
        </svg>
      </div>
      <p class="error-title">No application running</p>
      <p class="error-subtitle">Start your application and it will appear here automatically.</p>
      <span class="error-badge" id="error-runtime-badge" style="display:none">
        <span class="dot"></span>
        <span id="error-runtime-label"></span>
      </span>
    </div>

    <!-- allow-same-origin is required: without it the frame gets an opaque origin and every
         subresource it loads is blocked by Cross-Origin-Resource-Policy: same-origin -->
    <iframe id="preview-frame" sandbox="allow-scripts allow-forms allow-same-origin" style="display:none" title="Runtime preview"></iframe>
  </div>

  <script>
    const DEFAULT_MAPPINGS = []

    // The app is reported as running as soon as the user hits Run, but the kit's HTTP
    // server may need seconds to bind. Until then the proxy answers 502 with a valid
    // (empty) HTML body, so iframe load/error events cannot tell us when it is up.
    // Keep probing the preview URL and swap the iframe in the moment it answers 200.
    const FAST_PROBE_INTERVAL = 700
    const SLOW_PROBE_INTERVAL = 2000
    const IDLE_PROBE_INTERVAL = 5000
    const FAST_PROBE_WINDOW = 20000

    let runtimeMappings = DEFAULT_MAPPINGS
    // When true the preview shows app-core's built-in default route instead of
    // the UI the running application generates.
    let showDefaultUi = false
    let currentRuntimeName = null
    let lastPreviewUrl = null
    // JWT access token from parent — iframe.src cannot set Authorization
    let accessToken = null

    let probeTimer = null
    let probeGeneration = 0
    let isAppRunning = false
    let waitStartedAt = 0

    function onWidgetLoaded(options) {
      if (options && Array.isArray(options.runtimeMappings) && options.runtimeMappings.length > 0) {
        runtimeMappings = options.runtimeMappings
      }
      if (options && typeof options.showDefaultUi === 'boolean') {
        showDefaultUi = options.showDefaultUi
      }
      // Widget options can arrive after runtime-info, so rebuild the preview in
      // case runtimeMappings/showDefaultUi changed where it should point.
      if (currentRuntimeName) applyPreview(currentRuntimeName)
    }

    function el(id) {
      return document.getElementById(id)
    }

    function buildPreviewUrl(previewPath) {
      let url = window.location.origin + previewPath
      if (accessToken) {
        url += (previewPath.indexOf('?') >= 0 ? '&' : '?') + 'access_token=' + encodeURIComponent(accessToken)
      }
      return url
    }

    function applyBadge(badgeId, labelId, runtimeName) {
      const badge = el(badgeId)
      if (runtimeName) {
        el(labelId).textContent = runtimeName
        badge.style.display = 'inline-flex'
      } else {
        badge.style.display = 'none'
      }
    }

    // Single owner of visibility: 'placeholder' | 'connecting' | 'error' | 'preview'
    function setState(state, runtimeName) {
      const frame = el('preview-frame')

      el('placeholder').style.display = state === 'placeholder' ? 'flex' : 'none'
      el('connecting-state').style.display = state === 'connecting' ? 'flex' : 'none'
      el('error-state').style.display = state === 'error' ? 'flex' : 'none'
      frame.style.display = state === 'preview' ? 'block' : 'none'

      if (state !== 'preview' && frame.src !== 'about:blank') {
        frame.src = 'about:blank'
      }

      applyBadge('connecting-runtime-badge', 'connecting-runtime-label', runtimeName)
      applyBadge('error-runtime-badge', 'error-runtime-label', runtimeName)
    }

    function showError(runtimeName) {
      setState('error', runtimeName)
    }

    function showPreview() {
      setState('preview', currentRuntimeName)
      el('preview-frame').src = lastPreviewUrl
    }

    async function probePreview(url) {
      try {
        const res = await fetch(url, { method: 'GET', cache: 'no-store', credentials: 'include' })
        if (res.body && typeof res.body.cancel === 'function') {
          try {
            await res.body.cancel()
          } catch {
            // ignore
          }
        }
        return res.ok
      } catch {
        return false
      }
    }

    function nextProbeInterval() {
      if (!isAppRunning) return IDLE_PROBE_INTERVAL
      return Date.now() - waitStartedAt < FAST_PROBE_WINDOW ? FAST_PROBE_INTERVAL : SLOW_PROBE_INTERVAL
    }

    function stopProbing() {
      probeGeneration++
      if (probeTimer) {
        clearTimeout(probeTimer)
        probeTimer = null
      }
    }

    // Never give up while a runtime is selected: a slow app can take far longer than a
    // single check, and a late start must still be picked up on its own.
    function startProbing() {
      if (!lastPreviewUrl) return
      stopProbing()

      const gen = probeGeneration
      const url = lastPreviewUrl
      waitStartedAt = Date.now()
      setState('connecting', currentRuntimeName)

      const tick = async function () {
        if (gen !== probeGeneration) return

        const ok = await probePreview(url)
        // Runtime/token may have changed while the probe was in flight
        if (gen !== probeGeneration || url !== lastPreviewUrl) return

        if (ok) {
          probeTimer = null
          showPreview()
          return
        }

        if (!isAppRunning || Date.now() - waitStartedAt >= FAST_PROBE_WINDOW) {
          showError(currentRuntimeName)
        }
        probeTimer = setTimeout(tick, nextProbeInterval())
      }

      tick()
    }

    function computePreviewPath(name) {
      const match = runtimeMappings.find(function (m) {
        return name.endsWith(m.suffix) || name === m.suffix
      })

      const basePath = match ? match.path : '/runtime-preview/' + name.replace(/runtime-/i, '')
      // app-core's ApplicationRuntime.mount() always registers a fixed default
      // route alongside the base path, so Default UI is reached by appending
      // /default.
      return showDefaultUi ? basePath.replace(/\/+$/, '') + '/default' : basePath
    }

    function applyPreview(name) {
      if (!name) {
        stopProbing()
        lastPreviewUrl = null
        el('placeholder-text').textContent = 'No runtime selected'
        setState('placeholder')
        return
      }

      lastPreviewUrl = buildPreviewUrl(computePreviewPath(name))

      startProbing()
    }

    function applyRuntimeName(name) {
      if (name === currentRuntimeName) return
      currentRuntimeName = name
      applyPreview(name)
    }

    function onAppRunningStateChanged(running) {
      isAppRunning = !!running

      if (isAppRunning) {
        // Restart the fast window even if a slow poll was already running
        if (lastPreviewUrl) startProbing()
        return
      }

      stopProbing()
      if (currentRuntimeName || lastPreviewUrl) {
        showError(currentRuntimeName)
      } else {
        setState('placeholder')
      }
    }

    window.addEventListener('message', function (e) {
      // Only accept dashboard parent (same origin). Sandboxed kit posts with origin "null".
      if (e.origin !== window.location.origin) return
      if (!e.data) return
      let payload
      try {
        payload = typeof e.data === 'string' ? JSON.parse(e.data) : e.data
      } catch {
        return
      }
      if (payload && payload.cmd === 'runtime-info') {
        if (Object.prototype.hasOwnProperty.call(payload, 'accessToken')) {
          const nextToken = payload.accessToken || null
          if (nextToken !== accessToken) {
            accessToken = nextToken
            // Force URL rebuild when token arrives/changes after runtime was selected
            currentRuntimeName = null
          }
        }
        applyRuntimeName(payload.runtimeName || null)
      }
    })
  </script>
</body>
</html>
