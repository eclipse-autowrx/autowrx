<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/builtin-widgets/tailwind.min.css" />
  <script defer src="/builtin-widgets/syncer.js"></script>
  <style>
    #preview-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
      padding: 16px;
    }

    #placeholder svg {
      width: 40px;
      height: 40px;
      opacity: 0.4;
    }

    /* Error state, and busy state shares the same layout */
    #error-state,
    #busy-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      text-align: center;
      padding: 32px;
      background: #fafafa;
    }

    #error-state .error-icon,
    #busy-state .error-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    #error-state .error-icon svg,
    #busy-state .error-icon svg {
      width: 26px;
      height: 26px;
      color: #9ca3af;
    }

    #loading-state .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid #e5e7eb;
      border-top-color: #6b7280;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #error-state .error-title,
    #busy-state .error-title {
      font-size: 15px;
      font-weight: 600;
      color: #374151;
      margin: 0;
    }

    #error-state .error-subtitle,
    #busy-state .error-subtitle {
      font-size: 13px;
      color: #9ca3af;
      margin: 0;
      max-width: 260px;
      line-height: 1.5;
    }

    #error-state .error-badge,
    #busy-state .error-badge {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 9999px;
      padding: 3px 10px;
      font-size: 11px;
      color: #6b7280;
      font-family: ui-monospace, monospace;
    }

    #error-state .error-badge .dot,
    #busy-state .error-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d1d5db;
      flex-shrink: 0;
    }

    /* Loading / retry state */
    #loading-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      text-align: center;
      padding: 32px;
      background: #fafafa;
    }

    #loading-state .loading-text {
      font-size: 13px;
      color: #9ca3af;
      margin: 0;
    }
  </style>
</head>
<body class="h-screen overflow-hidden bg-gray-50">
  <div id="container" class="w-full h-full">

    <!-- No runtime selected -->
    <div id="placeholder">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M9 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-4M9 3l6 0m-6 0v6m6-6v6m0 0H9m6 0v8" />
      </svg>
      <span id="placeholder-text">No runtime selected</span>
    </div>

    <!-- Connection / runtime error -->
    <div id="error-state">
      <div class="error-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M5.636 5.636a9 9 0 1 0 12.728 12.728A9 9 0 0 0 5.636 5.636zM12 8v4m0 4h.01" />
        </svg>
      </div>
      <p class="error-title">No application running</p>
      <p class="error-subtitle">Start your application and it will appear here automatically.</p>
      <span class="error-badge" id="error-runtime-badge" style="display:none">
        <span class="dot"></span>
        <span id="error-runtime-label"></span>
      </span>
    </div>

    <!-- Runtime occupied by another session -->
    <div id="busy-state">
      <div class="error-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zM12 15.75h.008v.008H12v-.008z" />
        </svg>
      </div>
      <p class="error-title">Runtime is busy</p>
      <p class="error-subtitle">Another session is running an app here. Please wait until it finishes.</p>
      <span class="error-badge" id="busy-runtime-badge" style="display:none">
        <span class="dot"></span>
        <span id="busy-runtime-label"></span>
      </span>
    </div>

    <!-- Loading / retry state -->
    <div id="loading-state">
      <div class="spinner"></div>
      <p class="loading-text" id="loading-text">Connecting to runtime...</p>
    </div>

    <!-- allow-same-origin is required: without it the frame gets an opaque origin and every
         subresource it loads is blocked by Cross-Origin-Resource-Policy: same-origin -->
    <iframe id="preview-frame" sandbox="allow-scripts allow-forms allow-same-origin" style="display:none" title="Runtime preview"></iframe>
  </div>

  <script src="widget.js"></script>
</body>
</html>
