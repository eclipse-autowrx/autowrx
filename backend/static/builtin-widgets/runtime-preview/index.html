<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/builtin-widgets/tailwind.min.css" />
  <script defer src="/builtin-widgets/syncer.js"></script>
  <style>
    #preview-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
      padding: 16px;
    }

    #placeholder svg {
      width: 40px;
      height: 40px;
      opacity: 0.4;
    }

    /* Error state */
    #error-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      text-align: center;
      padding: 32px;
      background: #fafafa;
    }

    #error-state .error-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    #error-state .error-icon svg {
      width: 26px;
      height: 26px;
      color: #9ca3af;
    }

    #error-state .error-title {
      font-size: 15px;
      font-weight: 600;
      color: #374151;
      margin: 0;
    }

    #error-state .error-subtitle {
      font-size: 13px;
      color: #9ca3af;
      margin: 0;
      max-width: 260px;
      line-height: 1.5;
    }

    #error-state .error-badge {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 9999px;
      padding: 3px 10px;
      font-size: 11px;
      color: #6b7280;
      font-family: ui-monospace, monospace;
    }

    #error-state .error-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d1d5db;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="h-screen overflow-hidden bg-gray-50">
  <div id="container" class="w-full h-full">

    <!-- No runtime selected -->
    <div id="placeholder">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M9 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-4M9 3l6 0m-6 0v6m6-6v6m0 0H9m6 0v8" />
      </svg>
      <span id="placeholder-text">No runtime selected</span>
    </div>

    <!-- Connection / runtime error -->
    <div id="error-state">
      <div class="error-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M5.636 5.636a9 9 0 1 0 12.728 12.728A9 9 0 0 0 5.636 5.636zM12 8v4m0 4h.01" />
        </svg>
      </div>
      <p class="error-title">No application running</p>
      <p class="error-subtitle">Start your application and it will appear here automatically.</p>
      <span class="error-badge" id="error-runtime-badge" style="display:none">
        <span class="dot"></span>
        <span id="error-runtime-label"></span>
      </span>
    </div>

    <iframe id="preview-frame" sandbox="allow-scripts allow-forms" style="display:none" title="Runtime preview"></iframe>
  </div>

  <script>
    const DEFAULT_MAPPINGS = []

    let runtimeMappings = DEFAULT_MAPPINGS
    let currentRuntimeName = null
    let lastPreviewUrl = null

    function onWidgetLoaded(options) {
      if (options && Array.isArray(options.runtimeMappings) && options.runtimeMappings.length > 0) {
        runtimeMappings = options.runtimeMappings
      }
    }

    function showError(runtimeName) {
      const placeholder = document.getElementById('placeholder')
      const frame = document.getElementById('preview-frame')
      const errorState = document.getElementById('error-state')
      const badge = document.getElementById('error-runtime-badge')
      const badgeLabel = document.getElementById('error-runtime-label')

      placeholder.style.display = 'none'
      frame.style.display = 'none'
      frame.src = 'about:blank'
      errorState.style.display = 'flex'

      if (runtimeName) {
        badgeLabel.textContent = runtimeName
        badge.style.display = 'inline-flex'
      } else {
        badge.style.display = 'none'
      }
    }

    function hideError() {
      document.getElementById('error-state').style.display = 'none'
    }

    function reloadPreview() {
      if (!lastPreviewUrl) return
      const frame = document.getElementById('preview-frame')
      const placeholder = document.getElementById('placeholder')
      hideError()
      frame.onerror = function () {
        showError(currentRuntimeName)
      }
      if (frame.src === lastPreviewUrl) {
        frame.src = 'about:blank'
      }
      frame.src = lastPreviewUrl
      placeholder.style.display = 'none'
      frame.style.display = 'block'
    }

    function applyRuntimeName(name) {
      if (name === currentRuntimeName) return
      currentRuntimeName = name

      const placeholder = document.getElementById('placeholder')
      const placeholderText = document.getElementById('placeholder-text')
      const frame = document.getElementById('preview-frame')

      hideError()

      if (!name) {
        lastPreviewUrl = null
        frame.style.display = 'none'
        frame.src = 'about:blank'
        placeholder.style.display = 'flex'
        placeholderText.textContent = 'No runtime selected'
        return
      }

      const match = runtimeMappings.find(function (m) {
        return name.endsWith(m.suffix) || name === m.suffix
      })

      const previewPath = match ? match.path : '/runtime-preview/' + name.replace(/runtime-/i, '')
      lastPreviewUrl = window.location.origin + previewPath

      frame.onerror = function () {
        showError(currentRuntimeName)
      }

      if (frame.src !== lastPreviewUrl) {
        frame.src = lastPreviewUrl
      }

      placeholder.style.display = 'none'
      frame.style.display = 'block'
    }

    function onAppRunningStateChanged(isRunning) {
      if (isRunning) {
        if (lastPreviewUrl || currentRuntimeName) {
          hideError()
          reloadPreview()
        }
      } else {
        showError(currentRuntimeName)
      }
    }

    window.addEventListener('message', function (e) {
      if (!e.data) return
      let payload
      try {
        payload = typeof e.data === 'string' ? JSON.parse(e.data) : e.data
      } catch {
        return
      }
      if (payload && payload.cmd === 'runtime-info') {
        applyRuntimeName(payload.runtimeName || null)
      }
    })
  </script>
</body>
</html>
