<html>

<head>
  <link rel="stylesheet" href="../tailwind.min.css">
  <script defer src="../syncer.js"></script>
  <style>
    @font-face {
      font-family: 'Manrope';
      src: url('../Manrope-VariableFont.ttf') format('truetype');
      font-weight: 100 900;
      font-display: swap;
    }

    body {
      font-family: 'Manrope', sans-serif;
    }

    .text-big {
      font-size: 13px !important;
    }

    .text-content {
      font-size: 12px !important;
    }

    .rtl {
      direction: rtl;
      text-overflow: ellipsis;
    }

    .signal-desc-clamped {
      display: flex;
      overflow: hidden;
      align-items: baseline;
    }

    .signal-desc-text {
      flex: 1 1 0%;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .signal-desc-expanded {
      display: block;
      overflow: visible;
    }

    .signal-desc-expanded .signal-desc-text {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }

    .signal-desc-toggle {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      color: rgb(148 163 184);
      cursor: pointer;
      display: inline;
      white-space: nowrap;
      vertical-align: baseline;
    }

    .signal-desc-toggle:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body class="flex flex-col bg-white h-full w-full overflow-auto text-gray-800">

  <table id="api-table" class="table-auto w-full">
    <tbody>
      <!-- Dynamic content will be inserted here -->
    </tbody>
  </table>

  <script src="widget.js"></script>
</body>

</html>
